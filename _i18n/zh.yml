  home.about.label: "关于"
  home.about.title: "从开发软件，到研究软件为何失效。"
  home.about.p1: >-
    我在爱荷华州立大学攻读计算机科学博士学位，师从程序分析与人工智能实验室（Program Analysis and AI Lab）的
    <a href="https://weile.work/" rel="noopener">Wei Le 教授</a>。我的研究方向包括可靠的 AI 系统、数值调试，
    以及面向机器学习系统的软件工程技术。
  home.about.p2: >-
    读博之前，我做了四年软件工程师，参与过银行、电子政务、AI 和移动平台的开发。这段工业界经历塑造了我做研究的方式：
    我更看重那些能真正变成开发者和研究者手中实用工具的方法。更完整的经历请见
    <a href="{{ '/about-me/' | lurl }}">详细介绍页</a>。
  home.research.label: "研究兴趣"
  home.research.title: "表象之下，究竟发生了什么？"
  home.research.q1: "这个答案可信吗？"
  home.research.a1: "研究大语言模型的幻觉问题，评估智能系统在哪些环节失去可靠性。"
  home.research.q2: "数字是在哪里出错的？"
  home.research.a2: "在支撑机器学习的软件中，追踪数值不稳定和悄无声息的性能退化。"
  home.research.q3: "怎样让它真正有用？"
  home.research.a3: "开发可解释的测试与调试工具，帮助人们理解并修复故障。"
