  home.about.label: "Sobre mí"
  home.about.title: "De crear software a investigar por qué falla."
  home.about.p1: >-
    Soy estudiante de doctorado en Ciencias de la Computación en Iowa State University, bajo la dirección de
    <a href="https://weile.work/" rel="noopener">Wei Le</a> en el Program Analysis and AI Lab. Mi investigación
    se centra en sistemas de IA fiables, depuración numérica y técnicas de ingeniería de software para sistemas
    de aprendizaje automático.
  home.about.p2: >-
    Antes del doctorado, pasé cuatro años en la ingeniería de software, trabajando en banca, gobierno electrónico, IA y
    plataformas móviles. Esa experiencia en la industria marca mi forma de investigar: me interesan los métodos
    que pueden convertirse en herramientas prácticas para quienes desarrollan e investigan. La trayectoria completa
    está en la <a href="{{ '/about-me/' | lurl }}">página “Sobre mí”</a>.
  home.research.label: "Líneas de investigación"
  home.research.title: "¿Qué pasa bajo la superficie?"
  home.research.q1: "¿Podemos fiarnos de la respuesta?"
  home.research.a1: "Estudio las alucinaciones de los LLM y evalúo en qué punto los sistemas inteligentes dejan de ser fiables."
  home.research.q2: "¿Dónde se tuerce un número?"
  home.research.a2: "Rastreo la inestabilidad numérica y las regresiones silenciosas en el software que mueve el aprendizaje automático."
  home.research.q3: "¿Cómo lo hacemos útil?"
  home.research.a3: "Creo herramientas de prueba y depuración interpretables que ayudan a entender los fallos y a corregirlos."
