  home.about.label: "Обо мне"
  home.about.title: "От разработки ПО — к изучению того, почему оно ломается."
  home.about.p1: >-
    Учусь в аспирантуре по компьютерным наукам в Университете штата Айова под руководством
    <a href="https://weile.work/" rel="noopener">Wei Le</a> в Program Analysis and AI Lab. Мои исследования посвящены
    надёжным системам ИИ, отладке численных вычислений и методам программной инженерии для систем машинного обучения.
  home.about.p2: >-
    До аспирантуры — четыре года в разработке ПО: банковские системы, электронное правительство, ИИ и мобильные
    платформы. Этот опыт в индустрии определяет мой подход к науке: меня интересуют методы, которые могут стать
    практичными инструментами для разработчиков и исследователей. Полная хронология — на
    <a href="{{ '/about-me/' | lurl }}">подробной странице «Обо мне»</a>.
  home.research.label: "Научные интересы"
  home.research.title: "Что происходит под поверхностью?"
  home.research.q1: "Можно ли доверять ответу?"
  home.research.a1: "Изучаю галлюцинации LLM и выясняю, где именно интеллектуальные системы теряют надёжность."
  home.research.q2: "Где число сбивается с пути?"
  home.research.a2: "Отслеживаю численную неустойчивость и незаметные регрессии в ПО, на котором держится машинное обучение."
  home.research.q3: "Как сделать это полезным?"
  home.research.a3: "Создаю понятные инструменты тестирования и отладки, которые помогают разобраться в сбоях и исправить их."
