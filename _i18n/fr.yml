  home.about.label: "À propos"
  home.about.title: "Du logiciel en production à l’étude de ses défaillances."
  home.about.p1: >-
    Je prépare un doctorat en informatique à Iowa State University, sous la direction de
    <a href="https://weile.work/" rel="noopener">Wei Le</a>, au sein du Program Analysis and AI Lab. Mes recherches
    portent sur la fiabilité des systèmes d’IA, le débogage numérique et les techniques de génie logiciel appliquées
    aux systèmes d’apprentissage automatique.
  home.about.p2: >-
    Avant ce doctorat, j’ai passé quatre ans en ingénierie logicielle, sur des plateformes bancaires,
    d’administration électronique, d’IA et mobiles. Cette expérience du terrain oriente ma façon de chercher&#8239;:
    je m’intéresse aux méthodes qui peuvent devenir de vrais outils pour les développeurs et les chercheurs.
    Le parcours complet se trouve sur la <a href="{{ '/about-me/' | lurl }}">page «&nbsp;À propos&nbsp;» détaillée</a>.
  home.research.label: "Thèmes de recherche"
  home.research.title: "Que se passe-t-il sous la surface&#8239;?"
  home.research.q1: "Peut-on se fier à la réponse&#8239;?"
  home.research.a1: "J’étudie les hallucinations des LLM et j’évalue à quel moment les systèmes intelligents cessent d’être fiables."
  home.research.q2: "Où un nombre déraille-t-il&#8239;?"
  home.research.a2: "Je traque l’instabilité numérique et les régressions silencieuses dans les logiciels qui font tourner l’apprentissage automatique."
  home.research.q3: "Comment rendre tout cela utile&#8239;?"
  home.research.a3: "Je conçois des outils de test et de débogage interprétables qui aident à comprendre les défaillances et à les corriger."
