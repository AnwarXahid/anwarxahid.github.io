  course.dates: "Desenho de disciplinas"
  course.role: "Desenvolvimento curricular &middot; Iowa State University"
  course.text: >-
    Ajudei a desenhar as disciplinas <strong>COMS 3710X: Introduction to Foundation Models I</strong> e
    <strong>COMS 3720X: Introduction to Foundation Models II</strong> com <strong>Wei Le</strong> e
    <strong>Qi Li</strong>, no Departamento de Ciência da Computação.
  ta.dates: "Primavera de 2023 &ndash; atual"
  ta.role: "Assistente de ensino"
  ta.p1: >-
    Conduzi as aulas de laboratório e de exercícios de <strong>COM&nbsp;S&nbsp;127</strong> (introdução à
    programação) &mdash; laboratórios semanais, materiais de aula e de avaliação, rubricas de correção e correção de
    trabalhos e provas.
  ta.p2: >-
    Dei aulas de <strong>COM&nbsp;S&nbsp;472/572</strong> (Principles of Artificial Intelligence) substituindo
    Jin Tian, antes da saída do departamento, e Yan-Bin Jia.

