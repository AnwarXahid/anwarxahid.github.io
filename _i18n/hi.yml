    cover_label: "सॉफ़्टवेयर इंजीनियरिंग शिक्षा"
    cover_title: "बनाते-बनाते सीखें।"
    cover_caption: "वर्चुअल इंटर्नशिप का एक वैचारिक प्लेटफ़ॉर्म।"

  0-todaysai:
    title: "Today's AI — सही AI टूल खोजें, उन्हें इस्तेमाल करना सीखें"
    excerpt: "स्कूल, अंडरग्रेजुएट और ग्रेजुएट विद्यार्थियों — और AI में दिलचस्पी रखने वाले हर व्यक्ति — के लिए एक वेब प्लेटफ़ॉर्म, जहाँ सही AI टूल खोजे और उन्हें इस्तेमाल करना सीखा जा सकता है। प्रो. Wei Le के मार्गदर्शन में इसके क्रिएटर और लीड डेवलपर के रूप में बनाया।"
    cover_label: "AI साक्षरता"
    cover_caption: "टूल खोजें। इस्तेमाल करना सीखें।"
  1-soft-assertion:
    excerpt: "FSE 2025 का पेपर, जो ML ऐप्लिकेशन में न्यूमेरिकल अस्थिरता वाले बग पकड़ने और उन्हें सामने लाने के लिए Soft Assertions पेश करता है।"
    cover_label: "ML टेस्टिंग"
    cover_caption: "ML में न्यूमेरिकल अस्थिरता पकड़ें।"
  2-varity-contibution:
    title: "GPU न्यूमेरिकल टेस्टिंग – Varity में HIP कोड जनरेशन"
    excerpt: "LLNL के Varity प्रोजेक्ट में GPU कर्नेल टेस्टिंग के लिए HIP बैकएंड जनरेशन जोड़ा, ताकि अलग-अलग प्लेटफ़ॉर्म पर गणना के नतीजों की एकरूपता जाँची जा सके।"
    cover_label: "LLNL / Varity"
    cover_title: "हर GPU पर।"
    cover_caption: "न्यूमेरिकल टेस्टिंग के लिए HIP कोड जनरेशन।"
  3-Hate-Speech:
    title: "भौगोलिक संदर्भ के साथ हेट स्पीच की पहचान"
    excerpt: "एक क्लास प्रोजेक्ट को आगे बढ़ाकर भौगोलिक मेटाडेटा के साथ हेट स्पीच पहचानने वाले मॉडलों का मूल्यांकन किया। बाद में इसे बड़े भाषा मॉडलों की टेस्टिंग के लिए ढाला गया और 2025 में प्रकाशित किया गया।"
    cover_label: "भाषा + भूगोल"
    cover_title: "संदर्भ में शब्द।"
    cover_caption: "LLM से हेट स्पीच की पहचान का मूल्यांकन।"
  4-face-recog:
    title: "लाइवनेस डिटेक्शन के साथ फ़ेस रिकग्निशन"
    excerpt: "फ़िनटेक ऐप्लिकेशन के लिए रियल-टाइम फ़ेस रिकग्निशन और फ़र्ज़ीवाड़ा पहचानने वाला सिस्टम बनाया, जिससे दूर बैठे बैंकिंग वेरिफ़िकेशन ज़्यादा सुरक्षित हुआ।"
    cover_label: "कंप्यूटर विज़न"
    cover_title: "चेहरा + लाइवनेस"
    cover_caption: "बैंकिंग के लिए चेहरे की पहचान और फ़र्ज़ीवाड़े की रोकथाम।"

