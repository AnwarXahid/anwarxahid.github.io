  ta.role: "টিচিং অ্যাসিস্ট্যান্ট"
  ta.p1: >-
    <strong>COM&nbsp;S&nbsp;127</strong> (প্রোগ্রামিংয়ের প্রাথমিক কোর্স)-এর ল্যাব ও রিসিটেশন সেকশন নিয়েছি &mdash;
    প্রতি সপ্তাহের ল্যাব চালানো, কোর্স ও মূল্যায়নের উপকরণ তৈরি, গ্রেডিং রুব্রিক বানানো, আর অ্যাসাইনমেন্ট ও পরীক্ষার খাতা দেখা।
  ta.p2: >-
    <strong>COM&nbsp;S&nbsp;472/572</strong> (Principles of Artificial Intelligence) কোর্সে লেকচার দিয়েছি:
    অধ্যাপক Jin Tian বিভাগ ছাড়ার আগে তাঁর হয়ে, এবং অধ্যাপক Yan-Bin Jia-র হয়ে।

