  home.about.label: "نبذة"
  home.about.title: "من بناء البرمجيات إلى دراسة أسباب إخفاقها."
  home.about.p1: >-
    أُعِدّ أطروحة الدكتوراه في علوم الحاسوب في جامعة ولاية آيوا، بإشراف
    <a href="https://weile.work/" rel="noopener">Wei Le</a> في مختبر Program Analysis and AI Lab. تتركّز أبحاثي على
    أنظمة الذكاء الاصطناعي الموثوقة، وتصحيح الأخطاء العددية، وتقنيات هندسة البرمجيات لأنظمة تعلّم الآلة.
  home.about.p2: >-
    قبل الدكتوراه، أمضيت أربع سنوات في هندسة البرمجيات على منصات مصرفية وأنظمة للحكومة الإلكترونية والذكاء
    الاصطناعي وتطبيقات الهاتف المحمول. هذه الخلفية الصناعية هي ما يوجّه طريقتي في البحث: تهمّني الأساليب التي يمكن
    أن تتحوّل إلى أدوات عملية بين أيدي المطوّرين والباحثين. السيرة الكاملة في
    <a href="{{ '/about-me/' | lurl }}">صفحة النبذة المفصّلة</a>.
  home.research.label: "اهتمامات بحثية"
  home.research.title: "ماذا يجري تحت السطح؟"
  home.research.q1: "هل يمكن الوثوق بالإجابة؟"
  home.research.a1: "أدرس هلوسة النماذج اللغوية الكبيرة، وأقيّم المواضع التي تفقد فيها الأنظمة الذكية موثوقيتها."
  home.research.q2: "أين ينحرف الرقم؟"
  home.research.a2: "أتتبّع عدم الاستقرار العددي والتراجعات الصامتة في البرمجيات التي يقوم عليها تعلّم الآلة."
  home.research.q3: "كيف نجعل ذلك مفيدًا؟"
  home.research.a3: "أبني أدوات اختبار وتصحيح قابلة للتفسير تساعد الناس على فهم الأعطال وإصلاحها."
