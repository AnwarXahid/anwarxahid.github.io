  home.about.label: "Sobre"
  home.about.title: "De entregar software a estudar por que ele falha."
  home.about.p1: >-
    Faço doutorado em Ciência da Computação na Iowa State University, com orientação de
    <a href="https://weile.work/" rel="noopener">Wei Le</a> no Program Analysis and AI Lab. Minha pesquisa se
    concentra em sistemas de IA confiáveis, depuração numérica e técnicas de engenharia de software para sistemas
    de aprendizado de máquina.
  home.about.p2: >-
    Antes do doutorado, passei quatro anos trabalhando com engenharia de software em plataformas de bancos, governo
    eletrônico, IA e dispositivos móveis. Essa bagagem na indústria define meu jeito de pesquisar: me interessam os
    métodos que podem virar ferramentas práticas para quem desenvolve e pesquisa. A trajetória completa está na
    <a href="{{ '/about-me/' | lurl }}">página “Sobre” detalhada</a>.
  home.research.label: "Interesses de pesquisa"
  home.research.title: "O que acontece abaixo da superfície?"
  home.research.q1: "Dá para confiar na resposta?"
  home.research.a1: "Estudo as alucinações de LLMs e avalio em que ponto os sistemas inteligentes deixam de ser confiáveis."
  home.research.q2: "Onde um número sai dos trilhos?"
  home.research.a2: "Rastreio a instabilidade numérica e as regressões silenciosas no software que move o aprendizado de máquina."
  home.research.q3: "Como tornar isso útil?"
  home.research.a3: "Crio ferramentas de teste e depuração interpretáveis, que ajudam as pessoas a entender falhas e corrigi-las."
