<!doctype html>
<html lang="{{ site.locale | default: 'en-US' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title and page.title != "" %}{{ page.title }} {{ site.title_separator | default: "-" }} {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | normalize_whitespace }}">
    <meta name="author" content="{{ site.name }}">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <meta name="theme-color" content="#ffffff">

    <meta property="og:type" content="website">
    <meta property="og:title" content="{% if page.title and page.title != "" %}{{ page.title }} {{ site.title_separator | default: "-" }} {% endif %}{{ site.title }}">
    <meta property="og:description" content="{{ page.excerpt | default: site.description | strip_html | normalize_whitespace }}">
    <meta property="og:url" content="{{ page.url | absolute_url }}">

    <link rel="icon" href="{{ '/images/favicon.svg' | relative_url }}" type="image/svg+xml">
    <link rel="stylesheet" href="{{ '/assets/css/lab.css' | relative_url }}">

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Anwar Zahid",
        "url": "{{ site.url }}",
        "email": "mailto:{{ site.author.email }}",
        "sameAs": [
          "https://github.com/AnwarXahid",
          "https://www.linkedin.com/in/anwar-hossain-zahid-a46195108/",
          "https://scholar.google.com/citations?user=_ze57HEAAAAJ&hl=en"
        ],
        "knowsAbout": [
          "LLM hallucination",
          "AI reliability",
          "Software engineering for AI systems",
          "Interpretable analysis",
          "Human-centered AI tools"
        ]
      }
    </script>
  </head>
  <body class="{{ page.body_class | default: 'personal-page' }}">
    <header class="site-header">
      <a class="site-title" href="{{ '/' | relative_url }}">Anwar Zahid</a>
      <nav class="site-nav" aria-label="Primary navigation">
        <a href="{{ '/#about' | relative_url }}">About</a>
        <a href="{{ '/#research' | relative_url }}">Research</a>
        <a href="{{ '/#projects' | relative_url }}">Projects</a>
        <a href="{{ '/#publications' | relative_url }}">Writing</a>
        <a href="{{ '/#contact' | relative_url }}">Contact</a>
      </nav>
    </header>

    <main class="page">
      {{ content }}
    </main>

    <footer class="site-footer">
      <span>&copy; {{ site.time | date: '%Y' }} Anwar Zahid</span>
      <a href="mailto:ahzahid@iastate.edu">ahzahid@iastate.edu</a>
    </footer>
  </body>
</html>
