  2025-07-01-soft-assertions:
    excerpt: "Apresenta Soft Assertions, um método para detectar e provocar bugs ocultos de instabilidade numérica em aplicações de aprendizado de máquina."
    cover_label: "Confiabilidade de ML"
    cover_caption: "Encontre os bugs escondidos nos números."
  2025-02-26-hate-speech-geographical-context:
    excerpt: "Avalia o desempenho de grandes modelos de linguagem na detecção de discurso de ódio quando recebem contexto geográfico e social."
    cover_label: "Avaliação de LLMs"
    cover_title: "O contexto importa."
    cover_caption: "Detecção de discurso de ódio em diferentes regiões."
  2024-10-12-testing-gpu-numerics:
    excerpt: "Estuda diferenças numéricas entre execuções em GPUs NVIDIA e AMD e suas consequências para a reprodutibilidade e a portabilidade."
    cover_label: "Computação numérica em GPU"
    cover_caption: "Mesmo cálculo. Resultados diferentes."
  2020-12-19-virtual-internship-system:
    excerpt: "Apresenta o projeto conceitual de uma plataforma de software para estágios virtuais e para avaliar habilidades de desenvolvimento de software."
    cover_label: "Ensino de engenharia de software"
    cover_title: "Aprender fazendo."
    cover_caption: "Uma plataforma conceitual de estágio virtual."

  0-todaysai:
    title: "Today's AI — Encontre ferramentas de IA e aprenda a usá-las"
    excerpt: "Uma plataforma web que ajuda estudantes da educação básica, da graduação e da pós — e qualquer pessoa curiosa sobre IA — a encontrar as ferramentas certas e aprender a usá-las. Criação e desenvolvimento principal sob a orientação de Wei Le."
    cover_label: "Letramento em IA"
    cover_caption: "Descubra ferramentas. Aprenda a usá-las."
  1-soft-assertion:
    excerpt: "Artigo do FSE 2025 que apresenta Soft Assertions para detectar e provocar bugs de instabilidade numérica em aplicações de ML."
    cover_label: "Testes de ML"
    cover_caption: "Detecte instabilidade numérica em ML."
  2-varity-contibution:
    title: "Testes numéricos em GPU – Geração de código HIP no Varity"
    excerpt: "Contribuição para o projeto Varity, do LLNL, com a geração de um backend HIP para testar kernels de GPU, permitindo avaliar a consistência numérica entre plataformas."
    cover_label: "LLNL / Varity"
    cover_title: "Entre GPUs."
    cover_caption: "Geração de código HIP para testes numéricos."
  3-Hate-Speech:
    title: "Detecção de discurso de ódio com contexto geográfico"
    excerpt: "Um projeto de disciplina ampliado para avaliar modelos de detecção de discurso de ódio com metadados geográficos. Depois foi adaptado para testar grandes modelos de linguagem e publicado em 2025."
    cover_label: "Linguagem + geografia"
    cover_title: "Palavras em contexto."
    cover_caption: "Avaliando a detecção de ódio com LLMs."
  4-face-recog:
    title: "Reconhecimento facial com prova de vida"
    excerpt: "Sistema de reconhecimento facial e detecção de fraude em tempo real para aplicações de fintech, que reforça a verificação bancária a distância."
    cover_label: "Visão computacional"
    cover_title: "Rosto + prova de vida"
    cover_caption: "Reconhecimento e antifraude para bancos."

