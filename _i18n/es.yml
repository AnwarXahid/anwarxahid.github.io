  "2024-10-12": "Publicado en arXiv el preprint sobre pruebas numéricas en GPU de NVIDIA y AMD."
  "2024-08-01": "Mención honorífica en el LLNL Summer SLAM & Poster Symposium 2024."
  "2024-05-01": "Comienzo de unas prácticas de verano en el Parallel Systems Group del Lawrence Livermore National Laboratory."

