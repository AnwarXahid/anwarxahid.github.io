  home.about.label: "পরিচিতি"
  home.about.title: "সফটওয়্যার বানানো থেকে, সফটওয়্যার কেন ব্যর্থ হয় তার গবেষণায়।"
  home.about.p1: >-
    আমি আইওয়া স্টেট ইউনিভার্সিটিতে কম্পিউটার সায়েন্সে পিএইচডি করছি। প্রোগ্রাম অ্যানালাইসিস অ্যান্ড এআই ল্যাবে
    আমার সুপারভাইজার <a href="https://weile.work/" rel="noopener">অধ্যাপক Wei Le</a>। আমার গবেষণার মূল বিষয়
    নির্ভরযোগ্য AI সিস্টেম, নিউমেরিক্যাল ডিবাগিং, আর মেশিন লার্নিং সিস্টেমের জন্য সফটওয়্যার ইঞ্জিনিয়ারিং কৌশল।
  home.about.p2: >-
    পিএইচডি শুরুর আগে চার বছর সফটওয়্যার ইঞ্জিনিয়ার হিসেবে ব্যাংকিং, ই-গভর্ন্যান্স, AI ও মোবাইল প্ল্যাটফর্মে কাজ
    করেছি। ইন্ডাস্ট্রির সেই অভিজ্ঞতাই আমার গবেষণার ধরন ঠিক করে দেয়: আমি এমন পদ্ধতি নিয়ে কাজ করতে চাই, যা
    ডেভেলপার ও গবেষকদের হাতে কাজের টুল হয়ে উঠতে পারে। পুরো সময়রেখা আছে
    <a href="{{ '/about-me/' | lurl }}">বিস্তারিত পরিচিতির পাতায়</a>।
  home.research.label: "গবেষণার আগ্রহ"
  home.research.title: "উপরিতলের নিচে আসলে কী ঘটে?"
  home.research.q1: "উত্তরটা কি বিশ্বাস করা যায়?"
  home.research.a1: "LLM-এর হ্যালুসিনেশন নিয়ে গবেষণা করি, আর খুঁজি বুদ্ধিমান সিস্টেম ঠিক কোথায় নির্ভরযোগ্যতা হারায়।"
  home.research.q2: "সংখ্যাটা ভুল হয় কোথায়?"
  home.research.a2: "মেশিন লার্নিং যে সফটওয়্যারের ওপর চলে, তার ভেতরে নিউমেরিক্যাল অস্থিরতা আর নিঃশব্দে ঢুকে পড়া রিগ্রেশনের উৎস খুঁজে বের করি।"
  home.research.q3: "কীভাবে একে কাজে লাগানো যায়?"
  home.research.a3: "এমন ব্যাখ্যাযোগ্য টেস্টিং ও ডিবাগিং টুল বানাই, যা দিয়ে মানুষ ব্যর্থতার কারণ বুঝতে আর তা ঠিক করতে পারে।"
