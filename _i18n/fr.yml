    excerpt: "Propose la conception d’une plateforme logicielle pour organiser des stages virtuels et évaluer les compétences en développement logiciel."
    cover_label: "Enseignement du génie logiciel"
    cover_title: "Apprendre en construisant."
    cover_caption: "Une plateforme conceptuelle de stages virtuels."

  0-todaysai:
    title: "Today's AI — Trouver les bons outils d’IA et apprendre à s’en servir"
    excerpt: "Une plateforme web qui aide élèves, étudiants de licence et de master — et toute personne curieuse de l’IA — à trouver les outils d’IA adaptés et à apprendre à les utiliser. Création et développement principal sous la direction de Wei Le."
    cover_label: "Culture de l’IA"
    cover_caption: "Découvrir les outils. Apprendre à s’en servir."
  1-soft-assertion:
    excerpt: "Article de FSE 2025 présentant Soft Assertions pour détecter et déclencher les bugs d’instabilité numérique dans les applications de ML."
    cover_label: "Test de ML"
    cover_caption: "Détecter l’instabilité numérique en ML."
  2-varity-contibution:
    title: "Tests numériques sur GPU – Génération de code HIP dans Varity"
    excerpt: "Contribution au projet Varity du LLNL&#8239;: génération d’un backend HIP pour tester les noyaux GPU et évaluer la cohérence numérique d’une plateforme à l’autre."
    cover_label: "LLNL / Varity"
    cover_title: "D’un GPU à l’autre."
    cover_caption: "Génération de code HIP pour les tests numériques."
  3-Hate-Speech:
    title: "Détection des discours haineux avec contexte géographique"
    excerpt: "Un projet de cours prolongé pour évaluer des modèles de détection des discours haineux à l’aide de métadonnées géographiques, adapté ensuite au test des grands modèles de langage et publié en 2025."
    cover_label: "Langue + géographie"
    cover_title: "Les mots en contexte."
    cover_caption: "Évaluer la détection des discours haineux par les LLM."
  4-face-recog:
    title: "Reconnaissance faciale avec détection du vivant"
    excerpt: "Système de reconnaissance faciale et de détection d’usurpation en temps réel pour la fintech, afin de sécuriser la vérification bancaire à distance."
    cover_label: "Vision par ordinateur"
    cover_title: "Visage + vivant"
    cover_caption: "Reconnaissance et anti-usurpation pour la banque."

