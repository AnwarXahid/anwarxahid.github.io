  home.about.title: "سافٹ ویئر بنانے سے اس کی ناکامی کی وجوہات کی تحقیق تک۔"
  home.about.p1: >-
    آئیووا اسٹیٹ یونیورسٹی میں کمپیوٹر سائنس میں میری پی ایچ ڈی جاری ہے، جہاں پروگرام اینالیسس اینڈ AI لیب میں
    میرے نگران <a href="https://weile.work/" rel="noopener">پروفیسر Wei Le</a> ہیں۔ میری تحقیق کا مرکز قابلِ اعتماد
    AI نظام، عددی ڈیبگنگ اور مشین لرننگ نظاموں کے لیے سافٹ ویئر انجینئرنگ کی تکنیکیں ہیں۔
  home.about.p2: >-
    پی ایچ ڈی شروع کرنے سے پہلے میں نے چار سال سافٹ ویئر انجینئرنگ میں بینکاری، ای گورننس، AI اور موبائل
    پلیٹ فارمز پر کام کیا۔ انڈسٹری کا یہی تجربہ میری تحقیق کا رخ طے کرتا ہے: مجھے ایسے طریقوں سے دلچسپی ہے جو
    ڈویلپرز اور محققین کے لیے واقعی کارآمد ٹولز بن سکیں۔ مکمل سفر
    <a href="{{ '/about-me/' | lurl }}">تفصیلی تعارف کے صفحے</a> پر ہے۔
