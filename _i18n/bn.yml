news:
  "2026-05-01": "Today's AI চালু করেছি — AI টুল খুঁজে পাওয়া ও ব্যবহার করতে শেখার একটি প্ল্যাটফর্ম, অধ্যাপক Wei Le-এর সঙ্গে স্কুল, বিশ্ববিদ্যালয় আর নিজে নিজে শেখা মানুষদের জন্য বানানো।"
  "2025-07-01": "মেশিন লার্নিং অ্যাপ্লিকেশনে নিউমেরিক্যাল অস্থিরতা শনাক্তের পদ্ধতি Soft Assertions নিয়ে আমাদের পেপার FSE 2025-এ গৃহীত হয়েছে।"
  "2025-02-26": "ভৌগোলিক প্রেক্ষাপটসহ LLM দিয়ে ঘৃণাসূচক বক্তব্য শনাক্তকরণ নিয়ে প্রিপ্রিন্ট arXiv-এ প্রকাশিত।"
  "2024-10-12": "NVIDIA ও AMD GPU-র নিউমেরিক্স পরীক্ষা নিয়ে প্রিপ্রিন্ট arXiv-এ প্রকাশিত।"
  "2024-08-01": "LLNL Summer SLAM & Poster Symposium 2024-এ সম্মানসূচক স্বীকৃতি (Honorable Mention) পেয়েছি।"
  "2024-05-01": "লরেন্স লিভারমোর ন্যাশনাল ল্যাবরেটরির প্যারালাল সিস্টেমস গ্রুপে সামার ইন্টার্নশিপ শুরু করেছি।"

