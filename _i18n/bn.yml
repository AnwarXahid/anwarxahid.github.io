  course.text: >-
    কম্পিউটার সায়েন্স বিভাগে <strong>অধ্যাপক Wei Le</strong> ও <strong>অধ্যাপক Qi Li</strong>-এর সঙ্গে
    <strong>COMS 3710X: Introduction to Foundation Models I</strong> এবং
    <strong>COMS 3720X: Introduction to Foundation Models II</strong> কোর্স দুটি সাজাতে সাহায্য করেছি।
