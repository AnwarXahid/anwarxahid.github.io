---
layout: lab
---

<article class="page-intro">
  <p class="eyebrow">{% if page.date %}{{ page.date | ldate: "long" }}{% else %}{% t "post.note" %}Research Note{% endt %}{% endif %}</p>
  <h1{{ english_only }}>{{ page.title }}</h1>
  {% if page.excerpt %}
    <p{{ english_only }}>{{ page.excerpt | strip_html }}</p>
  {% endif %}
</article>

<section class="post-content prose"{{ english_only }}>
  {{ content }}
</section>

<p class="writing-more"><a href="{{ '/blog/' | lurl }}">{% t "post.all" %}&larr; All posts{% endt %}</a></p>
