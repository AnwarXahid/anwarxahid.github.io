  course.dates: "تصميم المقررات"
  course.role: "تطوير المناهج &middot; جامعة ولاية آيوا"
  course.text: >-
    شاركت في تصميم مقررَي <strong>COMS 3710X: Introduction to Foundation Models I</strong> و
    <strong>COMS 3720X: Introduction to Foundation Models II</strong> مع <strong>Wei Le</strong> و
    <strong>Qi Li</strong> في قسم علوم الحاسوب.
  ta.dates: "ربيع 2023 &ndash; حتى الآن"
  ta.role: "المساعدة في التدريس"
  ta.p1: >-
    تدريس حصص المختبر والتمارين لمقرر <strong>COM&nbsp;S&nbsp;127</strong> (مقدمة في البرمجة)&nbsp;&mdash;
    إدارة المختبرات الأسبوعية، وإعداد مواد المقرر والتقييم، وتصميم معايير التصحيح، وتصحيح الواجبات والامتحانات.
  ta.p2: >-
    إلقاء محاضرات في مقرر <strong>COM&nbsp;S&nbsp;472/572</strong> (Principles of Artificial Intelligence) نيابةً عن
    Jin Tian قبل مغادرة القسم، وعن Yan-Bin Jia.

