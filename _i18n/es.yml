  ta.role: "Asistente de docencia"
  ta.p1: >-
    Impartí los laboratorios y las clases prácticas de <strong>COM&nbsp;S&nbsp;127</strong> (introducción a la
    programación): laboratorios semanales, materiales del curso y de evaluación, rúbricas de calificación y corrección
    de tareas y exámenes.
  ta.p2: >-
    Di clases de <strong>COM&nbsp;S&nbsp;472/572</strong> (Principles of Artificial Intelligence) en sustitución de
    Jin Tian, antes de que dejara el departamento, y de Yan-Bin Jia.

