  course.text: >-
    Colaboré en el diseño de <strong>COMS 3710X: Introduction to Foundation Models I</strong> y
    <strong>COMS 3720X: Introduction to Foundation Models II</strong> junto con <strong>Wei Le</strong> y
    <strong>Qi Li</strong>, del Departamento de Ciencias de la Computación.
