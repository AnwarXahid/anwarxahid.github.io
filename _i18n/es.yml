  2025-07-01-soft-assertions:
    excerpt: "Presenta Soft Assertions, un método para detectar y provocar errores ocultos de inestabilidad numérica en aplicaciones de aprendizaje automático."
    cover_label: "Fiabilidad del ML"
    cover_caption: "Encuentra los errores escondidos en los números."
  2025-02-26-hate-speech-geographical-context:
    excerpt: "Evalúa cómo detectan el discurso de odio los modelos de lenguaje grandes cuando se les da contexto geográfico y social."
    cover_label: "Evaluación de LLM"
    cover_title: "El contexto importa."
    cover_caption: "Detección de discurso de odio en distintas regiones."
  2024-10-12-testing-gpu-numerics:
    excerpt: "Estudia las diferencias numéricas entre ejecuciones en GPU de NVIDIA y AMD y lo que implican para la reproducibilidad y la portabilidad."
    cover_label: "Numérica en GPU"
    cover_caption: "Mismo cálculo. Resultados distintos."
  2020-12-19-virtual-internship-system:
    excerpt: "Propone el diseño conceptual de una plataforma de software para ofrecer prácticas virtuales y medir habilidades de desarrollo de software."
    cover_label: "Enseñanza de ingeniería de software"
    cover_title: "Aprender haciendo."
    cover_caption: "Una plataforma conceptual de prácticas virtuales."

  0-todaysai:
    title: "Today's AI — Descubre herramientas de IA y aprende a usarlas"
    excerpt: "Una plataforma web que ayuda a estudiantes de escuela, grado y posgrado —y a cualquier persona con curiosidad por la IA— a encontrar las herramientas adecuadas y aprender a usarlas. La creé y lideré su desarrollo bajo la dirección de Wei Le."
    cover_label: "Alfabetización en IA"
    cover_caption: "Descubre herramientas. Aprende a usarlas."
  1-soft-assertion:
    excerpt: "Artículo de FSE 2025 que presenta Soft Assertions para detectar y provocar errores de inestabilidad numérica en aplicaciones de ML."
    cover_label: "Pruebas de ML"
    cover_caption: "Detecta la inestabilidad numérica en ML."
  2-varity-contibution:
    title: "Pruebas numéricas en GPU – Generación de código HIP en Varity"
    excerpt: "Contribuí al proyecto Varity del LLNL con la generación de un backend HIP para probar kernels de GPU, lo que permite evaluar la coherencia numérica entre plataformas."
    cover_label: "LLNL / Varity"
    cover_title: "Entre GPU."
    cover_caption: "Generación de código HIP para pruebas numéricas."
  3-Hate-Speech:
    title: "Detección de discurso de odio con contexto geográfico"
    excerpt: "Amplié un proyecto de clase para evaluar modelos de detección de discurso de odio con metadatos geográficos. Más tarde lo adapté para probar modelos de lenguaje grandes y se publicó en 2025."
    cover_label: "Lenguaje + geografía"
    cover_title: "Palabras en contexto."
    cover_caption: "Evaluación de la detección de odio con LLM."
  4-face-recog:
    title: "Reconocimiento facial con detección de vida"
    excerpt: "Desarrollé un sistema de reconocimiento facial y detección de suplantación en tiempo real para aplicaciones fintech, que refuerza la verificación bancaria a distancia."
    cover_label: "Visión por computadora"
    cover_title: "Rostro + vida"
    cover_caption: "Reconocimiento y antisuplantación para la banca."

news:
  "2026-05-01": "Lancé Today's AI, una plataforma para descubrir herramientas de IA y aprender a usarlas, creada junto con Wei Le para escolares, universitarios y personas que aprenden por su cuenta."
  "2025-07-01": "Nuestro artículo sobre Soft Assertions para detectar inestabilidad numérica en aplicaciones de ML fue aceptado en FSE 2025."
