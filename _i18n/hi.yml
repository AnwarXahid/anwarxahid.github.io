  home.about.label: "परिचय"
  home.about.title: "सॉफ़्टवेयर बनाने से लेकर, उसके फ़ेल होने की वजहों पर शोध तक।"
  home.about.p1: >-
    मैं आयोवा स्टेट यूनिवर्सिटी में कंप्यूटर साइंस का पीएचडी शोधार्थी हूँ। प्रोग्राम एनालिसिस एंड AI लैब में मेरे
    गाइड <a href="https://weile.work/" rel="noopener">प्रो. Wei Le</a> हैं। मेरा शोध भरोसेमंद AI सिस्टम,
    न्यूमेरिकल डीबगिंग और मशीन लर्निंग सिस्टम के लिए सॉफ़्टवेयर इंजीनियरिंग तकनीकों पर केंद्रित है।
  home.about.p2: >-
    पीएचडी शुरू करने से पहले मैंने चार साल सॉफ़्टवेयर इंजीनियर के रूप में बैंकिंग, ई-गवर्नेंस, AI और मोबाइल
    प्लेटफ़ॉर्म पर काम किया। इंडस्ट्री का यही अनुभव मेरे शोध की दिशा तय करता है: मुझे ऐसे तरीकों में दिलचस्पी है
    जो डेवलपरों और शोधकर्ताओं के लिए सचमुच काम के टूल बन सकें। पूरा सफ़र
    <a href="{{ '/about-me/' | lurl }}">विस्तृत परिचय वाले पेज</a> पर है।
  home.research.label: "शोध के विषय"
  home.research.title: "सतह के नीचे आख़िर होता क्या है?"
  home.research.q1: "क्या जवाब पर भरोसा किया जा सकता है?"
  home.research.a1: "LLM के हैलुसिनेशन का अध्ययन, और यह परखना कि इंटेलिजेंट सिस्टम कहाँ अपनी विश्वसनीयता खो देते हैं।"
  home.research.q2: "कोई संख्या ग़लत कहाँ होती है?"
  home.research.a2: "मशीन लर्निंग को चलाने वाले सॉफ़्टवेयर में न्यूमेरिकल अस्थिरता और चुपचाप घुस आए रिग्रेशन की जड़ तक पहुँचना।"
  home.research.q3: "इसे काम का कैसे बनाएँ?"
  home.research.a3: "समझ में आने वाले टेस्टिंग और डीबगिंग टूल बनाना, जिनसे लोग गड़बड़ियों को समझ सकें और ठीक कर सकें।"
