  course.dates: "Conception de cours"
  course.role: "Élaboration de programmes &middot; Iowa State University"
  course.text: >-
    Participation à la conception de <strong>COMS 3710X: Introduction to Foundation Models I</strong> et de
    <strong>COMS 3720X: Introduction to Foundation Models II</strong>, avec <strong>Wei Le</strong> et
    <strong>Qi Li</strong>, au département d’informatique.
  ta.dates: "Printemps 2023 &ndash; aujourd’hui"
  ta.role: "Auxiliaire d’enseignement"
  ta.p1: >-
    Encadrement des TP et des TD de <strong>COM&nbsp;S&nbsp;127</strong> (initiation à la programmation)&nbsp;&mdash;
    séances de TP hebdomadaires, supports de cours et d’évaluation, grilles de notation, correction des devoirs et des examens.
  ta.p2: >-
    Cours magistraux de <strong>COM&nbsp;S&nbsp;472/572</strong> (Principles of Artificial Intelligence), en
    remplacement de Jin Tian avant son départ du département, puis de Yan-Bin Jia.

